name: Build Installers

on:
  push:
    paths-ignore:
      - "Installer/**"
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-native-installers:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux installer (x64)
            os: ubuntu-22.04
            platform: linux
            arch: x64
          - label: Windows installer (x64)
            os: windows-latest
            platform: win32
            arch: x64
          - label: macOS installer (Intel)
            os: macos-15-intel
            platform: darwin
            arch: x64
          - label: macOS installer (Apple Silicon)
            os: macos-15
            platform: darwin
            arch: arm64

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Record installer job timing start
        run: echo "INSTALLER_TIMING_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve published Gecko ESR release
        run: node gecko/scripts/resolve-supported-esr-release.mjs >> "$GITHUB_ENV"

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -o Dpkg::Use-Pty=0 \
            curl \
            gcc \
            g++ \
            make \
            nasm \
            podman \
            flatpak \
            pkg-config \
            xz-utils \
            zip \
            unzip \
            imagemagick \
            desktop-file-utils \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libx11-xcb-dev \
            libasound2-dev \
            libpulse-dev \
            libffi-dev
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install npm dependencies
        run: npm ci

      - name: Install MozillaBuild and Windows packaging tools
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-CommandPath {
            param(
              [string]$CommandName,
              [string[]]$CandidatePaths
            )

            foreach ($candidatePath in $CandidatePaths) {
              if ($candidatePath -and (Test-Path $candidatePath)) {
                return $candidatePath
              }
            }

            $command = Get-Command $CommandName -ErrorAction SilentlyContinue
            if ($command) {
              return $command.Source
            }

            return $null
          }

          $nsisCandidatePaths = @(
            'C:\Program Files (x86)\NSIS\makensis.exe'
            'C:\Program Files\NSIS\makensis.exe'
          )
          $sevenZipCandidatePaths = @(
            'C:\Program Files\7-Zip\7z.exe'
            'C:\Program Files (x86)\7-Zip\7z.exe'
          )

          if (-not (Test-Path 'C:\mozilla-build')) {
            $installerPath = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup-Latest.exe'
            Invoke-WebRequest `
              -Uri 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' `
              -OutFile $installerPath
            Start-Process -FilePath $installerPath -ArgumentList '/S' -Wait
          }

          $chocoCommand = Get-Command choco.exe -ErrorAction SilentlyContinue
          if (-not $chocoCommand) {
            throw 'Chocolatey is unavailable on this runner, so Windows packaging prerequisites cannot be installed.'
          }

          $maxAttempts = 3
          $makensisPath = Find-CommandPath -CommandName 'makensis.exe' -CandidatePaths $nsisCandidatePaths
          $sevenZipPath = Find-CommandPath -CommandName '7z.exe' -CandidatePaths $sevenZipCandidatePaths

          if (-not $makensisPath -or -not $sevenZipPath) {
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt += 1) {
              $missingPackages = @()

              if (-not $makensisPath) {
                $missingPackages += 'nsis'
              }
              if (-not $sevenZipPath) {
                $missingPackages += '7zip.commandline'
              }
              if (-not $missingPackages.Count) {
                break
              }

              Write-Host "Installing missing Windows packaging tools (attempt $attempt/$maxAttempts): $($missingPackages -join ', ')"
              & $chocoCommand.Source install -y --no-progress @missingPackages

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Chocolatey exited with code $LASTEXITCODE while installing $($missingPackages -join ', ')."
              }

              $makensisPath = Find-CommandPath -CommandName 'makensis.exe' -CandidatePaths $nsisCandidatePaths
              $sevenZipPath = Find-CommandPath -CommandName '7z.exe' -CandidatePaths $sevenZipCandidatePaths

              if ($makensisPath -and $sevenZipPath) {
                break
              }

              if ($attempt -lt $maxAttempts) {
                Start-Sleep -Seconds (15 * $attempt)
              }
            }
          }

          if (-not $makensisPath -or -not $sevenZipPath) {
            $missingTools = @()

            if (-not $makensisPath) {
              $missingTools += 'NSIS (makensis.exe)'
            }
            if (-not $sevenZipPath) {
              $missingTools += '7-Zip (7z.exe)'
            }

            throw "Unable to provision required Windows packaging tools after $maxAttempts attempt(s): $($missingTools -join ', ')."
          }

          Write-Host "Using makensis at $makensisPath"
          Write-Host "Using 7z at $sevenZipPath"

          "MOZILLABUILD=C:\mozilla-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            'C:\mozilla-build\bin'
            'C:\mozilla-build\msys2\usr\bin'
            'C:\mozilla-build\moztools\bin'
            (Split-Path -Parent $makensisPath)
            (Split-Path -Parent $sevenZipPath)
          ) | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Choose Gecko checkout directory
        run: |
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            echo "GECKO_CHECKOUT_DIR=$RUNNER_TEMP/nodely-gecko" >> "$GITHUB_ENV"
          else
            echo "GECKO_CHECKOUT_DIR=$RUNNER_TEMP/firefox-esr" >> "$GITHUB_ENV"
          fi

      - name: Record installer pipeline timing start
        run: echo "INSTALLER_TIMING_PIPELINE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Bootstrap Gecko ESR checkout
        run: |
          set -o pipefail

          if ! npm run gecko:bootstrap -- --checkout-dir "$GECKO_CHECKOUT_DIR" --ref "$FIREFOX_ESR_REF" 2>&1 | tee gecko-bootstrap.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-bootstrap.log --mode bootstrap)"
            echo "::error title=Gecko bootstrap failed::$summary"
            exit 1
          fi

      - name: Write Gecko mozconfig
        run: |
          if [[ "${{ matrix.platform }}" == "linux" && "${{ matrix.arch }}" == "x64" ]]; then
            npm run gecko:mozconfig -- --checkout-dir "$GECKO_CHECKOUT_DIR" --mode full
            printf '%s\n' 'ac_add_options --without-wasm-sandboxed-libraries' >> "$GECKO_CHECKOUT_DIR/mozconfig.nodely"
          else
            npm run gecko:mozconfig -- --checkout-dir "$GECKO_CHECKOUT_DIR"
          fi

      - name: Build Gecko overlay target
        env:
          MOZCONFIG: mozconfig.nodely
          NODEJS: node
        run: |
          set -o pipefail

          if ! (
            cd "$GECKO_CHECKOUT_DIR"
            if [[ "${{ matrix.platform }}" == "darwin" ]]; then
              python ./mach configure
              python ./mach artifact install
              cd "$GITHUB_WORKSPACE"
              npm run gecko:sync -- --checkout-dir "$GECKO_CHECKOUT_DIR"
              npm run gecko:refresh-branding -- --checkout-dir "$GECKO_CHECKOUT_DIR" --mode compat
              cd "$GECKO_CHECKOUT_DIR"
              python ./mach build faster
            elif [[ "${{ matrix.platform }}" == "linux" && "${{ matrix.arch }}" == "x64" ]]; then
              printf '%s\n' "Using prepared Linux runtime flow for ${FIREFOX_ESR_VERSION}."
            else
              python ./mach build faster
            fi
          ) 2>&1 | tee gecko-build.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-build.log --mode build)"
            echo "::error title=Gecko overlay build failed::$summary"
            exit 1
          fi

      - name: Prepare official ESR Linux x64 runtime
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          set -o pipefail

          runtime_url="${FIREFOX_ESR_RUNTIME_URL}"
          runtime_archive="$RUNNER_TEMP/firefox-${FIREFOX_ESR_VERSION}.tar.xz"
          dist_dir="$GECKO_CHECKOUT_DIR/obj-nodely/dist"

          if ! curl --fail --location --retry 3 --retry-delay 10 --output "$runtime_archive" "$runtime_url" 2>&1 | tee official-esr-package.log; then
            echo "::error title=Official Firefox ESR download failed::Unable to download $runtime_url"
            exit 1
          fi

          rm -rf "$dist_dir"
          mkdir -p "$dist_dir"
          tar -xJf "$runtime_archive" -C "$dist_dir"
          mv "$dist_dir/firefox" "$dist_dir/nodely"
          ln -sf firefox-bin "$dist_dir/nodely/nodely-bin"

      - name: Sync Nodely overlay into prepared Linux runtime
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          set -o pipefail

          if ! npm run gecko:sync -- --checkout-dir "$GECKO_CHECKOUT_DIR" 2>&1 | tee gecko-sync.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-sync.log --mode stage)"
            echo "::error title=Nodely overlay sync failed::$summary"
            exit 1
          fi

      - name: Refresh artifact-build Nodely branding
        run: npm run gecko:refresh-branding -- --checkout-dir "$GECKO_CHECKOUT_DIR"

      - name: Validate macOS app bundle before packaging
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          dist_dir="$GECKO_CHECKOUT_DIR/obj-nodely/dist"
          app_bundle_count="$(find "$dist_dir" -type d -name '*.app' | wc -l | tr -d ' ')"

          if [[ "$app_bundle_count" == "0" ]]; then
            echo "No macOS app bundles found under $dist_dir." >&2
            exit 1
          fi

          while IFS= read -r app_bundle; do
            info_plist="$app_bundle/Contents/Info.plist"

            if [[ ! -f "$info_plist" ]]; then
              echo "Missing Info.plist in $app_bundle." >&2
              exit 1
            fi

            plutil -lint "$info_plist" >/dev/null
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
            executable_path="$app_bundle/Contents/MacOS/$executable_name"

            if [[ ! -x "$executable_path" ]]; then
              echo "Missing macOS app executable $executable_path." >&2
              exit 1
            fi

            echo "Validated $app_bundle"
          done < <(find "$dist_dir" -type d -name '*.app' | sort)

      - name: Run Nodely Gecko smoke verification
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: npm run gecko:smoke -- --checkout-dir "$GECKO_CHECKOUT_DIR"

      - name: Package Gecko build
        env:
          MOZCONFIG: mozconfig.nodely
          NODEJS: node
        run: |
          set -o pipefail

          if ! (
            if [[ "${{ matrix.platform }}" == "linux" && "${{ matrix.arch }}" == "x64" ]]; then
              artifact="$GECKO_CHECKOUT_DIR/obj-nodely/dist/nodely-browser-${FIREFOX_ESR_VERSION}.en-US.linux-x86_64.tar.xz"
              tar -cJf "$artifact" -C "$GECKO_CHECKOUT_DIR/obj-nodely/dist" nodely
              tar -tf "$artifact" | grep -E '(^|/)nodely-bin$|(^|/)firefox-bin$|(^|/)libxul\.so$|(^|/)application\.ini$'
            else
              cd "$GECKO_CHECKOUT_DIR"
              python ./mach package
            fi
          ) 2>&1 | tee gecko-package.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-package.log --mode package)"
            echo "::error title=Gecko package failed::$summary"
            exit 1
          fi

      - name: Sign and notarize macOS DMG
        if: matrix.platform == 'darwin'
        env:
          MACOS_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_CHANNEL: release
        run: bash scripts/sign-and-notarize-macos-release.sh

      - name: Stage Gecko release artifact
        run: |
          set -o pipefail

          if ! npm run gecko:stage-release -- --checkout-dir "$GECKO_CHECKOUT_DIR" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --channel ci 2>&1 | tee gecko-stage-release.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-stage-release.log --mode stage)"
            echo "::error title=Gecko release artifact staging failed::$summary"
            exit 1
          fi

      - name: Build platform installer
        run: |
          set -o pipefail
          installer_args=(
            --platform ${{ matrix.platform }}
            --arch ${{ matrix.arch }}
            --channel ci
            --no-sync
          )

          if [[ "${{ matrix.platform }}" != "linux" || "${{ matrix.arch }}" != "x64" ]]; then
            installer_args+=(--strict)
          fi

          if ! npm run installers -- "${installer_args[@]}" 2>&1 | tee installer-build.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log installer-build.log --mode installer)"
            echo "::error title=Installer build failed::$summary"
            exit 1
          fi

      - name: Record installer pipeline timing finish
        if: always()
        run: echo "INSTALLER_TIMING_PIPELINE_FINISHED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate packaged macOS DMG payload
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(out/make/darwin/${{ matrix.arch }}/*.dmg)

          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "No macOS DMG outputs were found to verify." >&2
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            echo "Validating $dmg"
            (
              set -euo pipefail
              mount_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nodely-dmg-XXXXXX")"

              cleanup() {
                hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
                rm -rf "$mount_dir"
              }

              trap cleanup EXIT

              hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg" >/dev/null
              app_bundles=()
              while IFS= read -r app_bundle; do
                app_bundles+=("$app_bundle")
              done < <(find "$mount_dir" -mindepth 1 -maxdepth 1 -type d -name '*.app' | sort)

              if [[ ${#app_bundles[@]} -ne 1 ]]; then
                echo "Expected exactly one macOS app bundle inside $dmg, found ${#app_bundles[@]}." >&2
                find "$mount_dir" -mindepth 1 -maxdepth 1 -print >&2 || true
                exit 1
              fi

              app_bundle="${app_bundles[0]}"
              info_plist="$app_bundle/Contents/Info.plist"

              if [[ ! -f "$info_plist" ]]; then
                echo "Missing Info.plist in mounted app bundle $app_bundle." >&2
                exit 1
              fi

              plutil -lint "$info_plist" >/dev/null

              if ! executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"; then
                echo "Unable to read CFBundleExecutable from $info_plist." >&2
                exit 1
              fi

              executable_path="$app_bundle/Contents/MacOS/$executable_name"

              if [[ ! -x "$executable_path" ]]; then
                echo "Missing mounted macOS app executable $executable_path." >&2
                exit 1
              fi

              if codesign_output="$(codesign --display --verbose=2 "$app_bundle" 2>&1)"; then
                printf '%s\n' "$codesign_output"
              else
                echo "::warning title=Unsigned macOS app bundle::$(basename "$app_bundle") inside $(basename "$dmg") is not signed; continuing because unsigned CI artifacts are currently allowed."
                printf '%s\n' "$codesign_output"
              fi
            )
          done

      - name: Assess macOS public release readiness
        if: matrix.platform == 'darwin'
        id: public_release_gate
        run: |
          set -euo pipefail
          shopt -s nullglob
          output_dir="out/make/darwin/${{ matrix.arch }}"
          marker="$output_dir/.public-release-ready"
          artifacts=("$output_dir"/*.dmg "$output_dir"/*.pkg)
          rm -f "$marker"

          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No macOS installers were found to assess for public release." >&2
            exit 1
          fi

          publish_ready=1

          for artifact in "${artifacts[@]}"; do
            echo "Assessing Gatekeeper readiness for $artifact"
            extension="${artifact##*.}"

            if [[ "$extension" == "pkg" ]]; then
              if assessment_output="$(spctl --assess --type install --verbose=4 "$artifact" 2>&1)"; then
                printf '%s\n' "$assessment_output"
              else
                echo "::warning title=macOS public release blocked::Gatekeeper rejected $(basename "$artifact"); excluding it from public release publication."
                printf '%s\n' "$assessment_output"
                publish_ready=0
              fi
            else
              if assessment_output="$(spctl --assess --type open --context context:primary-signature --verbose=4 "$artifact" 2>&1)"; then
                printf '%s\n' "$assessment_output"
              else
                echo "::warning title=macOS public release blocked::Gatekeeper rejected $(basename "$artifact"); excluding it from public release publication."
                printf '%s\n' "$assessment_output"
                publish_ready=0
              fi

              if ! (
                set -euo pipefail
                mount_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nodely-public-release-XXXXXX")"

                cleanup() {
                  hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
                  rm -rf "$mount_dir"
                }

                trap cleanup EXIT

                hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$artifact" >/dev/null
                app_bundle="$(find "$mount_dir" -mindepth 1 -maxdepth 1 -type d -name '*.app' | sort | head -n 1)"

                if [[ -z "$app_bundle" ]]; then
                  echo "No macOS app bundle was found inside $artifact during Gatekeeper assessment." >&2
                  exit 1
                fi

                if app_assessment="$(spctl --assess --type execute --verbose=4 "$app_bundle" 2>&1)"; then
                  printf '%s\n' "$app_assessment"
                else
                  echo "::warning title=macOS public release blocked::Gatekeeper rejected $(basename "$app_bundle") from $(basename "$artifact"); excluding it from public release publication."
                  printf '%s\n' "$app_assessment"
                  exit 1
                fi
              ); then
                publish_ready=0
              fi
            fi

            if stapler_output="$(xcrun stapler validate "$artifact" 2>&1)"; then
              printf '%s\n' "$stapler_output"
            else
              echo "::warning title=macOS public release blocked::Stapled notarization validation failed for $(basename "$artifact"); excluding it from public release publication."
              printf '%s\n' "$stapler_output"
              publish_ready=0
            fi
          done

          if [[ "$publish_ready" -eq 1 ]]; then
            touch "$marker"
            echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Linux x64 installer set
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          shopt -s nullglob
          required_patterns=(
            "out/make/linux/x64/Nodely-Browser-*-linux-x64.run"
            "out/make/linux/x64/Nodely-Browser-*-debian-x64.deb"
            "out/make/linux/x64/Nodely-Browser-*-ubuntu-x64.deb"
            "out/make/linux/x64/Nodely-Browser-*-linux-x64.flatpak"
          )

          for pattern in "${required_patterns[@]}"; do
            matches=($pattern)

            if [[ ${#matches[@]} -eq 0 ]]; then
              echo "Present Linux x64 installers:" >&2
              find out/make/linux/x64 -maxdepth 1 -type f -printf '  %f\n' | sort >&2 || true
              echo "::error title=Missing expected Linux x64 installer::$pattern"
              echo "Missing expected Linux x64 installer: $pattern" >&2
              exit 1
            fi
          done

      - name: Verify Ubuntu 22.04 / Linux Mint 21.3 compatibility
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          shopt -s nullglob
          debs=(out/make/linux/x64/Nodely-Browser-*-ubuntu-x64.deb)
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one Ubuntu DEB for Linux x64, found ${#debs[@]}." >&2
            printf '  %s\n' "${debs[@]}" >&2 || true
            exit 1
          fi
          if ! bash scripts/verify-ubuntu-deb-compat.sh --deb "${debs[0]}" 2>&1 | tee ubuntu-compat.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log ubuntu-compat.log --mode compat)"
            echo "::error title=Ubuntu 22.04 / Linux Mint 21.3 compatibility failed::$summary"
            exit 1
          fi

      - name: Upload installer output
        uses: actions/upload-artifact@v4
        with:
          name: installer-output-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-failure-logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            gecko-bootstrap.log
            gecko-build.log
            official-esr-package.log
            gecko-sync.log
            gecko-package.log
            gecko-stage-release.log
            installer-build.log
            ubuntu-compat.log
          if-no-files-found: ignore

      - name: Summarize installer timings
        if: always() && env.INSTALLER_TIMING_JOB_STARTED_AT != ''
        run: |
          node scripts/write-installer-timing-summary.mjs \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --job-label "Build ${{ matrix.label }}" \
            --job-start "$INSTALLER_TIMING_JOB_STARTED_AT" \
            --focus-label "Installer generation pipeline" \
            --focus-start "$INSTALLER_TIMING_PIPELINE_STARTED_AT" \
            --focus-end "${INSTALLER_TIMING_PIPELINE_FINISHED_AT:-}"

  assemble-installer-directory:
    name: Assemble Installer Directory
    needs:
      - build-native-installers
    if: needs.build-native-installers.result == 'success'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Record installer job timing start
        run: echo "INSTALLER_TIMING_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Record installer assembly timing start
        run: echo "INSTALLER_TIMING_PIPELINE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download installer outputs
        uses: actions/download-artifact@v4
        with:
          pattern: installer-output-*
          path: out/make
          merge-multiple: true

      - name: Ensure Installer directory exists
        run: |
          mkdir -p Installer

      - name: Prune managed installer slices before sync
        run: >
          npm run installers:prune --
          --target linux:arm64
          --target linux:x64
          --target win32:x64
          --target darwin:x64
          --target darwin:arm64

      - name: Sync finished installers into Installer
        run: |
          found_any=0

          for target in linux:x64 win32:x64 darwin:x64 darwin:arm64; do
            platform="${target%%:*}"
            arch="${target##*:}"

            if [[ -d "out/make/$platform/$arch" ]]; then
              if [[ "$platform" == "darwin" && ! -f "out/make/$platform/$arch/.public-release-ready" ]]; then
                echo "Skipping public sync for $platform/$arch because Gatekeeper/notarization checks did not pass."
                continue
              fi

              found_any=1
              npm run installers:sync -- \
                --platform "$platform" \
                --arch "$arch" \
                --built-by github-actions \
                --build-workflow .github/workflows/installers.yml \
                --build-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --gecko-version "$FIREFOX_ESR_VERSION"
            fi
          done

          if [[ "$found_any" -ne 1 ]]; then
            echo "No installer outputs were downloaded from build jobs." >&2
            exit 1
          fi

      - name: Generate latest installer release notes
        run: |
          NODELY_VERSION="$(node --input-type=module <<'NODE'
          import { readNodelyVersionMetadata } from "./scripts/nodely-version.mjs";
          process.stdout.write(readNodelyVersionMetadata().displayVersion);
          NODE
          )"

          bash scripts/generate-release-notes.sh \
            --output Installer/RELEASE_NOTES.MD \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.before }}" \
            --head "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --nodely-version "$NODELY_VERSION" \
            --gecko-version "$FIREFOX_ESR_VERSION"

      - name: Derive release metadata
        id: release_meta
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readdirSync, statSync } from "node:fs";
          import path from "node:path";

          import { extractInstallerVersion } from "./scripts/installers-lib.mjs";
          import { readNodelyVersionMetadata } from "./scripts/nodely-version.mjs";

          const allowedExtensions = new Set([".deb", ".rpm", ".flatpak", ".run", ".exe", ".dmg", ".pkg"]);
          const makeRoot = path.join("out", "make");
          const assetPaths = [];

          for (const platform of readdirSync(makeRoot, { withFileTypes: true })) {
            if (!platform.isDirectory()) {
              continue;
            }

            const platformDirectory = path.join(makeRoot, platform.name);

            for (const arch of readdirSync(platformDirectory, { withFileTypes: true })) {
              if (!arch.isDirectory()) {
                continue;
              }

              const archDirectory = path.join(platformDirectory, arch.name);

              if (platform.name === "darwin" && !existsSync(path.join(archDirectory, ".public-release-ready"))) {
                continue;
              }

              for (const entry of readdirSync(archDirectory, { withFileTypes: true })) {
                if (!entry.isFile()) {
                  continue;
                }

                const extension = path.extname(entry.name).toLowerCase();

                if (!allowedExtensions.has(extension) || !entry.name.startsWith("Nodely-Browser-")) {
                  continue;
                }

                const assetPath = path.posix.join(
                  "out",
                  "make",
                  platform.name,
                  arch.name,
                  entry.name
                );

                if (!statSync(path.join(archDirectory, entry.name)).size) {
                  continue;
                }

                assetPaths.push(assetPath);
              }
            }
          }

          assetPaths.sort();

          if (!assetPaths.length) {
            throw new Error("No built installer assets were found under out/make to publish.");
          }

          const versions = [...new Set(assetPaths.map((assetPath) => extractInstallerVersion(path.basename(assetPath))).filter(Boolean))];

          if (versions.length !== 1) {
            throw new Error(`Expected exactly one built Nodely version, found: ${versions.join(", ")}`);
          }

          const version = versions[0];
          const { displayVersion } = readNodelyVersionMetadata();

          if (version !== displayVersion) {
            throw new Error(`Built installer version ${version} does not match package.json Nodely version ${displayVersion}.`);
          }

          const outputPath = process.env.GITHUB_OUTPUT;

          appendFileSync(outputPath, `version=${version}\n`);
          appendFileSync(outputPath, `gecko_version=${process.env.FIREFOX_ESR_VERSION ?? ""}\n`);
          appendFileSync(outputPath, `tag=nodely-${version}\n`);
          appendFileSync(outputPath, `title=Nodely ${version}\n`);
          appendFileSync(outputPath, "assets<<EOF\n");
          appendFileSync(outputPath, `${assetPaths.join("\n")}\n`);
          appendFileSync(outputPath, "EOF\n");
          NODE

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
          RELEASE_ASSETS: ${{ steps.release_meta.outputs.assets }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file Installer/RELEASE_NOTES.MD
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file Installer/RELEASE_NOTES.MD \
              --target "$GITHUB_SHA"
          fi

          expected_macos_assets=()

          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              if [[ "$asset" == out/make/darwin/* ]]; then
                expected_macos_assets+=("$(basename "$asset")")
              fi

              gh release upload "$RELEASE_TAG" "$asset" --clobber
            fi
          done <<< "$RELEASE_ASSETS"

          while IFS= read -r asset_name; do
            if [[ -z "$asset_name" ]]; then
              continue
            fi

            keep_asset=0

            for expected_asset in "${expected_macos_assets[@]}"; do
              if [[ "$asset_name" == "$expected_asset" ]]; then
                keep_asset=1
                break
              fi
            done

            if [[ "$keep_asset" -eq 0 ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -E '^Nodely-Browser-.*-macos-(x64|arm64)\.(dmg|pkg)$' || true)

      - name: Commit promoted installers
        run: |
          if [[ -z "$(git status --porcelain -- Installer)" ]]; then
            echo "No Installer changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Installer
            git commit -m "chore: promote generated installers and notes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record installer assembly timing finish
        if: always()
        run: echo "INSTALLER_TIMING_PIPELINE_FINISHED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Upload assembled Installer directory
        uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: Installer
          if-no-files-found: error

      - name: Summarize installer timings
        if: always() && env.INSTALLER_TIMING_JOB_STARTED_AT != ''
        run: |
          node scripts/write-installer-timing-summary.mjs \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --job-label "Assemble Installer Directory" \
            --job-start "$INSTALLER_TIMING_JOB_STARTED_AT" \
            --focus-label "Installer assembly and publication" \
            --focus-start "$INSTALLER_TIMING_PIPELINE_STARTED_AT" \
            --focus-end "${INSTALLER_TIMING_PIPELINE_FINISHED_AT:-}"
