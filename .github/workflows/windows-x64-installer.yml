name: Build Windows x64 Installer

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Installer/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve published Gecko ESR release
        run: node gecko/scripts/resolve-supported-esr-release.mjs >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\mozilla-build')) {
            $installerPath = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup-Latest.exe'
            Invoke-WebRequest `
              -Uri 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' `
              -OutFile $installerPath
            Start-Process -FilePath $installerPath -ArgumentList '/S' -Wait
          }

          choco install -y nsis 7zip.commandline

          "MOZILLABUILD=C:\mozilla-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            'C:\mozilla-build\bin'
            'C:\mozilla-build\msys2\usr\bin'
            'C:\mozilla-build\moztools\bin'
            'C:\Program Files (x86)\NSIS'
            'C:\Program Files\7-Zip'
          ) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Choose Gecko checkout directory
        run: echo "GECKO_CHECKOUT_DIR=$RUNNER_TEMP/nodely-gecko" >> "$GITHUB_ENV"

      - name: Bootstrap Gecko ESR checkout
        run: |
          set -o pipefail
          if ! npm run gecko:bootstrap -- --checkout-dir "$GECKO_CHECKOUT_DIR" --ref "$FIREFOX_ESR_REF" 2>&1 | tee gecko-bootstrap.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-bootstrap.log --mode bootstrap)"
            echo "::error title=Gecko bootstrap failed::$summary"
            exit 1
          fi

      - name: Write Gecko mozconfig
        run: npm run gecko:mozconfig -- --checkout-dir "$GECKO_CHECKOUT_DIR"

      - name: Build Gecko overlay target
        env:
          MOZCONFIG: mozconfig.nodely
          NODEJS: node
        run: |
          set -o pipefail
          if ! (
            cd "$GECKO_CHECKOUT_DIR"
            python ./mach build faster
          ) 2>&1 | tee gecko-build.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-build.log --mode build)"
            echo "::error title=Gecko overlay build failed::$summary"
            exit 1
          fi

      - name: Refresh artifact-build Nodely branding
        run: npm run gecko:refresh-branding -- --checkout-dir "$GECKO_CHECKOUT_DIR"

      - name: Package Gecko build
        env:
          MOZCONFIG: mozconfig.nodely
          NODEJS: node
        run: |
          set -o pipefail
          if ! (
            cd "$GECKO_CHECKOUT_DIR"
            python ./mach package
          ) 2>&1 | tee gecko-package.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-package.log --mode package)"
            echo "::error title=Gecko package failed::$summary"
            exit 1
          fi

      - name: Stage Gecko release artifact
        run: |
          set -o pipefail
          if ! npm run gecko:stage-release -- --checkout-dir "$GECKO_CHECKOUT_DIR" --platform win32 --arch x64 --channel ci 2>&1 | tee gecko-stage-release.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log gecko-stage-release.log --mode stage)"
            echo "::error title=Gecko release artifact staging failed::$summary"
            exit 1
          fi

      - name: Build Windows x64 installer
        run: |
          set -o pipefail
          if ! npm run installers -- --platform win32 --arch x64 --channel ci --no-sync --strict 2>&1 | tee installer-build.log; then
            summary="$(node scripts/summarize-ci-log.mjs --log installer-build.log --mode installer)"
            echo "::error title=Windows installer build failed::$summary"
            exit 1
          fi

      - name: Derive Windows release metadata
        id: release_meta
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync, statSync } from "node:fs";
          import path from "node:path";

          import { extractInstallerVersion } from "./scripts/installers-lib.mjs";
          import { readNodelyVersionMetadata } from "./scripts/nodely-version.mjs";

          const outputDirectory = path.join("out", "make", "win32", "x64");
          const fileNames = readdirSync(outputDirectory)
            .filter((name) => name.startsWith("Nodely-Browser-"))
            .filter((name) => name.toLowerCase().endsWith(".exe"))
            .sort();

          if (!fileNames.length) {
            throw new Error(`No Windows installer assets were found in ${outputDirectory}.`);
          }

          const assets = fileNames
            .map((name) => path.join(outputDirectory, name))
            .filter((assetPath) => statSync(assetPath).size > 0)
            .map((assetPath) => assetPath.replaceAll(path.sep, path.posix.sep));

          if (!assets.length) {
            throw new Error(`Windows installer assets in ${outputDirectory} were empty.`);
          }

          const versions = [...new Set(fileNames.map((name) => extractInstallerVersion(name)).filter(Boolean))];

          if (versions.length !== 1) {
            throw new Error(`Expected exactly one Windows installer version, found: ${versions.join(", ")}`);
          }

          const version = versions[0];
          const { displayVersion } = readNodelyVersionMetadata();

          if (version !== displayVersion) {
            throw new Error(`Built Windows installer version ${version} does not match package.json Nodely version ${displayVersion}.`);
          }

          const outputPath = process.env.GITHUB_OUTPUT;

          appendFileSync(outputPath, `version=${version}\n`);
          appendFileSync(outputPath, `gecko_version=${process.env.FIREFOX_ESR_VERSION ?? ""}\n`);
          appendFileSync(outputPath, `tag=nodely-${version}\n`);
          appendFileSync(outputPath, `title=Nodely ${version}\n`);
          appendFileSync(outputPath, "assets<<EOF\n");
          appendFileSync(outputPath, `${assets.join("\n")}\n`);
          appendFileSync(outputPath, "EOF\n");
          NODE

      - name: Publish Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_ASSETS: ${{ steps.release_meta.outputs.assets }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            cat > windows-release-notes.md <<EOF
          Refreshed Windows x64 installer assets for Nodely ${RELEASE_VERSION}.
          Gecko base version: ${{ steps.release_meta.outputs.gecko_version }}.

          Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          EOF
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file windows-release-notes.md \
              --target "$GITHUB_SHA"
          fi

          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              gh release upload "$RELEASE_TAG" "$asset" --clobber
            fi
          done <<< "$RELEASE_ASSETS"

      - name: Report Windows installer outputs
        run: |
          find out/make/win32/x64 -maxdepth 1 -type f -printf 'Installer output: %f\n' | sort
          echo "Windows x64 verification uploads installers as workflow artifacts and refreshes the matching GitHub Release assets directly."

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer-failure-logs
          path: |
            gecko-bootstrap.log
            gecko-build.log
            gecko-package.log
            gecko-stage-release.log
            installer-build.log
          if-no-files-found: ignore

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installers
          path: out/make/win32/x64
          if-no-files-found: error
